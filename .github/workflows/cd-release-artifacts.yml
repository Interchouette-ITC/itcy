name: CD Release Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "dev"
  push:
    branches:
      - dev
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build release binaries
        run: make build

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp backend/target/release/itcy dist/
          cp backend/target/release/linkedin-itcy-gr-mcp dist/
          tar -C dist -czf itcy-linux-amd64.tar.gz itcy linkedin-itcy-gr-mcp

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: itcy-linux-amd64
          path: itcy-linux-amd64.tar.gz

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: itcy-linux-amd64.tar.gz
