[workspace]
resolver = "2"
members = ["crates/itcy", "crates/linkedin-itcy-gr-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Interchouette <contact@interchouette.net>"]
license = "BUSL-1.1"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
dotenvy = "0.15"
emojis = "0.9"
futures-util = "0.3"
hex = "0.4"
hmac = "0.13"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks"] }
rmcp = { version = "3", default-features = false, features = [
  "server",
  "client",
  "transport-io",
  "transport-child-process",
  "macros",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "chrono"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
