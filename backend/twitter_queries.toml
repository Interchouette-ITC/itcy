# Twitter/X search pool for /daily_digest (English; pulse appends lang:en).
# Not corpus storage - ephemeral discovery only.
#
# Scale: each digest runs at most 20 individual searches (no OR-batching).
# Picks are spaced across the ranked pool; the phase rotates daily so a
# large keyword list gets fair coverage over time.
# Curate here only (do not auto-pull from other checkouts).
#
# weight: ranking preference (higher tends to appear earlier in the ranked list).
# exclude: appended as -term to rust-ish queries when planning searches.

exclude = ["RustGame", "RustClips", "GamingYT"]

