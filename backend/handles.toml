# Social media handles for known entities.
# Loaded at startup into an in-memory index (~instant at 2K entries).
# The writer calls lookup_handles(name) during a draft/tweet turn; only the
# matching rows are returned - this file is never injected into a prompt.
#
# Fields:
#   name     - canonical entity name used for lookup (case-insensitive substring match)
#   linkedin - LinkedIn handle (@company-slug) or omit when unknown
#   x        - X / Twitter handle (@handle) or omit when unknown

